{% extends 'base.html' %}

{% block title %}Delete issue - Kikodo CRM{% endblock %}
{% block page_title %}Delete issue{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <p>Are you sure you want to delete the issue <strong>{{ issue.title|default:issue.slug }}</strong>? This cannot be undone.</p>
    <form method="post" action="{% url 'crm:newsletter_issue_delete' issue.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'crm:newsletter_issue_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
