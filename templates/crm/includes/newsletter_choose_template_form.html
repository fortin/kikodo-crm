<form method="post" action="{% url 'crm:newsletter_issue_create' %}">
  {% csrf_token %}
  <input type="hidden" name="action" value="select_template">
  {% if from_edition %}<input type="hidden" name="from_edition" value="{{ from_edition.pk }}">{% endif %}
  <fieldset class="mb-3">
    <legend class="visually-hidden">Newsletter template</legend>
    {% for t in templates %}
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="template_id" id="template-{{ t.pk }}" value="{{ t.pk }}" {% if default_template and default_template.pk == t.pk %}checked{% elif not default_template and forloop.first %}checked{% endif %} required>
      <label class="form-check-label" for="template-{{ t.pk }}">
        <strong>{{ t.name }}</strong>
        <span class="text-muted">· {{ t.sections.count }} section{{ t.sections.count|pluralize }}</span>
        {% if t.is_default %}<span class="badge bg-primary ms-1">Default</span>{% endif %}
      </label>
    </div>
    {% empty %}
    <p class="text-muted mb-0">No templates yet.</p>
    {% endfor %}
  </fieldset>
  {% if templates %}
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="make_default" value="1" id="make-default">
    <label class="form-check-label" for="make-default">
      Use this template by default for new issues
    </label>
  </div>
  {% endif %}
  <div class="d-flex flex-wrap gap-2">
    {% if templates %}
    <button type="submit" class="btn btn-primary">Continue</button>
    {% endif %}
    <button type="submit" class="btn btn-outline-secondary" name="skip_template" value="1" formnovalidate>Start without a template</button>
    <a href="{% url 'crm:newsletter_issue_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
