{% extends 'base.html' %}

{% block title %}Delete Edition - Kikodo CRM{% endblock %}
{% block page_title %}Delete Newsletter Edition{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <p>Are you sure you want to delete this edition?</p>
    <p><strong>{{ edition }}</strong></p>
    <form method="post" action="{% url 'crm:newsletter_edition_delete' edition.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'crm:newsletter_plan_year' year=edition.plan.year %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
