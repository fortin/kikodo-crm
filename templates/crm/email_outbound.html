<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    p { margin: 0 0 1em 0; }
    .signature {
      margin-top: 1.5em;
      padding-top: 1em;
      border-top: 1px solid #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="body">{{ body_html|safe }}</div>
  {% if signature_html %}
  <div class="signature">{{ signature_html|safe }}</div>
  {% endif %}
  <p><small><a href="%%UNSUBSCRIBE%%">opt-out</a></small></p>
</body>
</html>
