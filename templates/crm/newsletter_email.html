<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
    }
    table { border-collapse: collapse; }
    .newsletter-body { }
    /* Explicit heading scale: only h2 was styled before (~1.35rem), so h3+ fell back to
       client defaults and often looked larger than ## in email clients. */
    .newsletter-body h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin: 1.25em 0 0.5em 0;
    }
    .newsletter-body h2 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 1.5em 0 0.5em 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.25em;
    }
    .newsletter-body h3 {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.35;
      margin: 1.25em 0 0.4em 0;
    }
    .newsletter-body h4 {
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 1.1em 0 0.35em 0;
    }
    .newsletter-body h5,
    .newsletter-body h6 {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
      margin: 1em 0 0.3em 0;
    }
    .newsletter-body h1:first-child,
    .newsletter-body h2:first-child,
    .newsletter-body h3:first-child { margin-top: 0; }
    .newsletter-body .newsletter-section-first { padding-bottom: 1.25rem; }
    .newsletter-body p { margin: 0 0 1em 0; }
    .newsletter-body img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    /* Treat the first image in the body as the banner logo; constrain its width (not height)
       to avoid aspect-ratio issues in some email clients. */
    .newsletter-body img:first-of-type {
      width: 420px !important;
      max-width: 100% !important;
      height: auto !important;
      margin: 0 auto;
    }
    .newsletter-body .newsletter-divider img { max-width: 100%; height: auto; display: block; }
    .newsletter-body .newsletter-divider-hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 1.5em 0;
    }
    .newsletter-footer {
      margin-top: 2em;
      padding: 1.25em 1em;
      background-color: #3d3d41;
      font-size: 12px;
      line-height: 1.5;
      color: #fff;
      text-align: center;
    }
    .newsletter-footer a {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:#ffffff;">
    <tr>
      <td align="center" style="padding: 20px 12px;">
        {% if preheader %}
        <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all; font-size:1px; line-height:1px; color:#fff;">
          {{ preheader }}
        </div>
        <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all; font-size:1px; line-height:1px; color:#fff;">
          &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
        </div>
        {% endif %}

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">
          <tr>
            <td style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:16px; line-height:1.6; color:#333;">
              {% if view_in_browser_url %}
              <div style="font-size:12px; color:#6c757d; margin: 0 0 12px 0;">
                <a href="{{ view_in_browser_url }}" style="color:#0d6efd; text-decoration:none;">View this issue in your browser</a>
              </div>
              {% endif %}

              <div class="newsletter-body">{{ body_html|safe }}</div>

              <div class="newsletter-footer" style="margin-top:2em;padding:1.25em 1em;background-color:#3d3d41;font-size:12px;line-height:1.5;color:#fff;text-align:center;">
                <div style="margin:0;">© 2026 Kikodo Education Technologies, Sàrl</div>
                <div style="margin:0;">Louis Ruchonnet 19, Lausanne, 1003 VD</div>
                <div style="margin:0.75em 0 0 0;">
                  <a href="%%UNSUBSCRIBE%%" style="color:#fff;text-decoration:underline;">Unsubscribe</a>
                </div>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
